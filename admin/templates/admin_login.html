<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login · NicheForge</title>
<style>
:root{--bg:#0b0d10;--surface:#12151a;--border:#242b34;--text:#eef1f4;--muted:#9aa4af;--accent:#b8e62e;--accent-ink:#141800;--red:#f87171;--amber:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:34px 28px}
.mark{width:46px;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;margin-bottom:16px}
h1{margin:0 0 6px;font-size:1.35rem}p.sub{color:var(--muted);margin:0 0 20px;font-size:.92rem}
label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem}
input{width:100%;background:#171c22;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:14px;font-size:1rem;min-height:52px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:15px;font-weight:800;font-size:1rem;cursor:pointer;min-height:54px}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--red);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:var(--amber);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.85rem}
code{background:#08090b;padding:2px 7px;border-radius:6px;font-size:.82rem}
</style>
</head>
<body>
<div class="card">
  <div class="mark">N</div>
  <h1>Admin login</h1>
  <p class="sub">NicheForge control room — sirf aap ke liye.</p>
  {% if not password_set %}
  <div class="warn">⚠️ <b>NICHEFORGE_ADMIN_PASSWORD</b> set nahi hai.<br>
  Railway → Variables mein add karein, ya local par:<br>
  <code>export NICHEFORGE_ADMIN_PASSWORD="apna-password"</code></div>
  {% endif %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" autofocus>
    <button type="submit">Enter →</button>
  </form>
</div>
</body>
</html>
