name: Apply Obsidian Lime frontend v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip templates into admin/templates
        run: |
          set -e
          mkdir -p /tmp/tpl
          unzip -o nf-templates-v2.zip -d /tmp/tpl
          find /tmp/tpl -iname '*.html' -exec cp -f {} admin/templates/ \;
          rm -f nf-templates-v2.zip
          rm -rf /tmp/tpl
          ls -la admin/templates/
      - name: Commit updated templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Obsidian Lime frontend v2" || echo "nothing to commit"
          git push
